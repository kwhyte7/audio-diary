transcribe:
  whisper:
    # Model sizes, smallest to largest: tiny, base, small, medium, large, turbo
    model_size_or_path: small
    # "auto" picks cuda when available, otherwise cpu. Or set "cuda" / "cpu".
    device: auto
  beam_size: 5

writer:
  ollama: # put your arguments for your model here
    model: qwen3:4b
    # temperature : 0.6
  system_prompt: "Format this into a legible .md file of the transcription. DO NOT OMIT INFORMATION"

allow_signups: true
