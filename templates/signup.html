{% extends "base.html" %}
{% block title %}Sign up · Audio Diary{% endblock %}

{% block body %}
<div class="auth-page">
  <form class="auth-card" onsubmit="signUp(); return false;">
    <h1>Create your account</h1>
    <p class="auth-subtitle">Start turning your voice into documents.</p>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required autofocus>

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required>

    <label for="confirm-password">Confirm password</label>
    <input id="confirm-password" type="password" placeholder="Repeat your password" autocomplete="new-password" required>

    <p class="auth-message" id="message" aria-live="polite"></p>

    <button type="submit" id="submit">Sign up</button>
    <a class="auth-link" href="/login">Already have an account? Log in</a>
  </form>
</div>
{% endblock %}

{% block script %}
<script>
const messageElement = document.getElementById("message");
const submitButton = document.getElementById("submit");

async function signUp() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirm-password").value;

  messageElement.className = "auth-message";
  messageElement.textContent = "";

  if (!email || !password) {
    messageElement.className = "auth-message error";
    messageElement.textContent = "Please fill in every field.";
    return;
  }

  if (password !== confirmPassword) {
    messageElement.className = "auth-message error";
    messageElement.textContent = "Your passwords don't match.";
    return;
  }

  submitButton.disabled = true;
  submitButton.textContent = "Creating account...";

  try {
    const response = await fetch("/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await response.json();

    if (data.success) {
      messageElement.className = "auth-message success";
      messageElement.textContent = data.message;
      window.location.href = "/";
    } else {
      messageElement.className = "auth-message error";
      messageElement.textContent = data.message;
    }
  } catch (error) {
    messageElement.className = "auth-message error";
    messageElement.textContent = "Something went wrong. Please try again.";
  } finally {
    submitButton.disabled = false;
    submitButton.textContent = "Sign up";
  }
}
</script>
{% endblock %}
